<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LearnKit — Design System</title>
<link rel="stylesheet" href="styles/tokens.css" />
<style>
  html, body, #root { height: 100%; }
  body { background: var(--paper); }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components/wordmark.jsx"></script>
<script type="text/babel" src="components/primitives.jsx"></script>
<script type="text/babel" src="system/shell.jsx"></script>
<script type="text/babel" src="system/foundations.jsx"></script>
<script type="text/babel" src="system/components.jsx"></script>

<script type="text/babel">
const App = () => {
  const [active, setActive] = React.useState('colors');

  // Track scroll position to highlight active section in sidebar
  React.useEffect(() => {
    const handler = () => {
      const ids = SECTIONS.flatMap(g => g.items.map(i => i.id));
      let bestId = ids[0], bestTop = -Infinity;
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        const top = el.getBoundingClientRect().top;
        if (top < 120 && top > bestTop) { bestTop = top; bestId = id; }
      });
      setActive(bestId);
    };
    window.addEventListener('scroll', handler, { passive: true });
    handler();
    return () => window.removeEventListener('scroll', handler);
  }, []);

  return (
    <div data-screen-label="Design System" className="paper-grain" style={{ display: 'flex', minHeight: '100vh', background: 'var(--paper)' }}>
      <Sidebar active={active} onPick={setActive}/>
      <main style={{ flex: 1, minWidth: 0 }}>
        {/* Header */}
        <header style={{ padding: '64px 56px 0' }}>
          <Eyebrow>LearnKit · v0.9 · Last updated Apr 2026</Eyebrow>
          <h1 className="serif" style={{ fontSize: 60, lineHeight: 1.0, letterSpacing: '-0.03em', margin: '14px 0 14px', fontWeight: 400, maxWidth: 760 }}>
            The <span style={{ fontStyle: 'italic' }}>warm-academic</span> design system.
          </h1>
          <p style={{ fontSize: 16, color: 'var(--ink-soft)', lineHeight: 1.55, maxWidth: 640, margin: '0 0 28px' }}>
            Tokens, components, and motion guidelines used across LearnKit's landing, demo, API, and Teams surfaces. Designed to drop straight into a React + Tailwind stack — every spec ships with a code snippet a developer can paste.
          </p>
          <div style={{ display: 'inline-flex', gap: 18, padding: '12px 18px', background: 'var(--surface)', border: '1px solid var(--rule)', borderRadius: 12, fontSize: 12.5, color: 'var(--ink-soft)' }}>
            <span><strong style={{ color: 'var(--ink)' }}>4</strong> palettes</span>
            <span style={{ width: 1, background: 'var(--rule)' }}/>
            <span><strong style={{ color: 'var(--ink)' }}>11</strong> components</span>
            <span style={{ width: 1, background: 'var(--rule)' }}/>
            <span><strong style={{ color: 'var(--ink)' }}>5</strong> motion patterns</span>
            <span style={{ width: 1, background: 'var(--rule)' }}/>
            <span><strong style={{ color: 'var(--ink)' }}>3</strong> Olé states</span>
          </div>
        </header>

        <ColorsSection />
        <TypeSection />
        <SpacingSection />
        <RadiusShadowSection />
        <MotionSection />

        <ButtonsSection />
        <InputsSection />
        <RoleCardsSection />
        <ToolChipsSection />
        <LessonCardsSection />
        <ProgressCardsSection />
        <CodePreviewSection />
        <TestimonialSection />
        <PricingCardsSection />
        <AccordionSection />
        <OleSection />

        <NavFooterSection />

        <footer style={{ padding: '48px 56px', textAlign: 'center', borderTop: '1px solid var(--rule)', background: 'var(--paper-2)' }}>
          <p style={{ fontSize: 13, color: 'var(--ink-soft)', margin: 0 }}>
            End of system reference. See <strong style={{ color: 'var(--ink)' }}>Handoff.html</strong> for build order, API contracts, and MVP cuts.
          </p>
        </footer>
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
